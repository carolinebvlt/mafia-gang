<!DOCTYPE html>
<html>
<head>
    <title>Mafia-Gang</title>
</head>

<body>

<h1>Mafia-Gang</h1>

<h2>Create Player</h2>

<form method="POST">

    <label>Name:</label>
    <input type="text" name="name" required>

    <br><br>

    <label>Starting country:</label>

    <select name="country">

    {% for country in countries %}

        <option value="{{ country }}">
            {{ country }}
        </option>

    {% endfor %}

    </select>

    <br><br>

    <button type="submit">
        Create Player
    </button>

</form>


<h2>Existing Players</h2>

<form method="POST">

    <select name="player_id">

        {% for player in players %}

            <option value="{{ player['id'] }}">
                {{ player["name"] }}
            </option>

        {% endfor %}

    </select>

    <button type="submit">
        Play
    </button>

</form>

</body>
</html>
